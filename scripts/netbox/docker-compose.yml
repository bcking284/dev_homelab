---
# NetBox stack for the homelab.
#
#   mkdir -p ~/netbox && cd ~/netbox
#   # put this file here, plus a .env alongside it
#   docker compose up -d
#   docker compose exec netbox /opt/netbox/netbox/manage.py createsuperuser
#
# Reachable at http://<host>:8080
#
# Check https://github.com/netbox-community/netbox-docker for the current
# image tag before deploying; 4.x moves reasonably fast.

services:
  netbox:
    image: netboxcommunity/netbox:v4.1-3.0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
    env_file: .env
    user: "unit:root"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 120s
      timeout: 3s
      interval: 15s
    volumes:
      - netbox-media-files:/opt/netbox/netbox/media:rw
      - netbox-reports-files:/opt/netbox/netbox/reports:rw
      - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Background task queue: webhooks, scripts, reports
  netbox-worker:
    image: netboxcommunity/netbox:v4.1-3.0.2
    depends_on:
      netbox:
        condition: service_healthy
    env_file: .env
    user: "unit:root"
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    restart: unless-stopped

  # Nightly cleanup: expired sessions, changelog retention
  netbox-housekeeping:
    image: netboxcommunity/netbox:v4.1-3.0.2
    depends_on:
      netbox:
        condition: service_healthy
    env_file: .env
    user: "unit:root"
    command:
      - /opt/netbox/housekeeping.sh
    healthcheck:
      test: ps -aux | grep -v grep | grep -q housekeeping || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Task queue backend. Persistent.
  redis:
    image: valkey/valkey:8.0-alpine
    command:
      - sh
      - -c
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    env_file: .env
    healthcheck:
      test: '[ $$(valkey-cli --pass "$$REDIS_PASSWORD" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
      - netbox-redis-data:/data
    restart: unless-stopped

  # Caching backend. Disposable, no persistence needed.
  redis-cache:
    image: valkey/valkey:8.0-alpine
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_CACHE_PASSWORD
    env_file: .env
    healthcheck:
      test: '[ $$(valkey-cli --pass "$$REDIS_CACHE_PASSWORD" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    restart: unless-stopped

volumes:
  netbox-media-files:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-reports-files:
  netbox-scripts-files:
