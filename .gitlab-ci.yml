default:
  tags: [homelab]
  image: netauto:local

variables:
  ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible.cfg"
  INV: "inventories/lab/hosts.ini"
  TESTBED: "pyats/testbeds/lab.yml"
  LEARN: "ospf interface routing"
  PLAYBOOK: "playbooks/routing/ospf/configure_ospf.yml"

stages:
  - build
  - prevalidation
  - deploy
  - postvalidation

# ---------- build ----------
lint-yaml:
  stage: build
  script:
    - yamllint inventories/ playbooks/

validate-vars:
  stage: build
  script:
    - python scripts/validate_vars.py

# ---------- prevalidation ----------
reach-devices:
  stage: prevalidation
  script:
    - ansible -i $INV ios -m cisco.ios.ios_facts -a "gather_subset=min"

checkpoint:
  stage: prevalidation
  script:
    - ansible-playbook -i $INV playbooks/prevalidation/rollback_checkpoint.yml
  artifacts:
    paths: [backups/checkpoints/]
    expire_in: 30 days

snapshot-pre:
  stage: prevalidation
  script:
    - pyats learn $LEARN --testbed-file $TESTBED --output pyats/snapshots/pre
  artifacts:
    paths: [pyats/snapshots/pre]
    expire_in: 1 week

check-config:
  stage: prevalidation
  script:
    - ansible-playbook -i $INV $PLAYBOOK --check | tee check-config.txt
  artifacts:
    paths: [check-config.txt]
    expire_in: 1 week
    when: always

# ---------- deploy ----------
deploy:
  stage: deploy
  when: manual
  environment:
    name: lab
  script:
    - ansible-playbook -i $INV $PLAYBOOK

# ---------- postvalidation ----------
smoke-test:
  stage: postvalidation
  needs: [deploy]
  script:
    - ansible -i $INV all -m cisco.ios.ios_command -a "commands='show clock'"

snapshot-post:
  stage: postvalidation
  needs: [deploy, snapshot-pre]
  script:
    - pyats learn $LEARN --testbed-file $TESTBED --output pyats/snapshots/post
    - pyats diff pyats/snapshots/pre pyats/snapshots/post
  allow_failure: true
  artifacts:
    paths: [pyats/snapshots/, "diff_*"]
    when: always

rollback:
  stage: postvalidation
  when: manual
  needs: [deploy]
  script:
    - ansible-playbook -i $INV playbooks/quickies/rollback_replace.yml