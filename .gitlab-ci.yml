stages:
  - build
  - prevalidation

lint-yaml:
  stage: build
  tags: [homelab]
  image: python:3.12-slim
  script:
    - pip install --quiet --root-user-action=ignore yamllint
    - yamllint inventories/ playbooks/

validate-vars:
  stage: build
  tags: [homelab]
  image: python:3.12-slim
  script:
    - pip install --quiet --root-user-action=ignore pyyaml
    - python scripts/validate_vars.py

reach-devices:
  stage: prevalidation
  tags: [homelab]
  image: python:3.12-slim
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
  script:
    - pip install --quiet --root-user-action=ignore ansible-core
    - pip install --quiet --root-user-action=ignore paramiko
    - ansible-galaxy collection install cisco.ios
    - ansible -i inventories/lab/hosts.ini ios -m cisco.ios.ios_facts -a "gather_subset=min"