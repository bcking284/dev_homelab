stages:
  - build

lint-yaml:
  stage: build
  tags: [homelab]
  image: python:3.12-slim
  script:
    - pip install --quiet --root-user-action=ignore yamllint
    - yamllint -d relaxed inventories/ playbooks/

validate-vars:
  stage: build
  tags: [homelab]
  image: python:3.12-slim
  script:
    - pip install --quiet --root-user-action=ignore pyyaml
    - python scripts/validate_vars.py