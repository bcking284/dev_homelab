interface Gi4
    descr BGP transit to inet rtr ASN65513 
    ip address 10.0.3.2 255.255.255.0
    no shutdown

interface lo900
    ip address 10.0.26.1 255.255.255.255
    no shutdown

interface Gi1.900
    desc broadcast segment to R3 and R2
    encapsulation dot1q 900
    ip address 10.0.24.1 255.255.255.0
    ip ospf network broadcast
    no shutdown

interface Gi2.900
    desc p2p to R5 area 1
    encapsulation dot1q 900
    ip address 10.0.28.2 255.255.255.252
    ip ospf network point-to-point
    no shutdown

router ospf 2
    passive-interface default
    router-id 10.0.26.1
    area 1 stub
    network 10.0.24.0 0.0.0.255 area 0
    network 10.0.26.1 0.0.0.0 area 0
    network 10.0.28.0 0.0.0.3 area 1
    log
    no passive-interface Gi1.900
    no passive-interface Gi2.900