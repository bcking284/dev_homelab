interface GigabitEthernet1.900
 description Link to Broadcast
 ip address 10.0.24.2 255.255.255.252
 no shutdown
interface GigabitEthernet4.900
 description Link to R3
 ip address 10.0.25.1 255.255.255.252
 no shutdown
interface GigabitEthernet3.900
 description Link to R4 NSSA
 ip address 10.0.25.1 255.255.255.252
 no shutdown
interface Loopback900
 description R2 Router ID
 ip address 10.0.26.2 255.255.255.255
 no shutdown
router ospf 900
router-id 10.0.26.2
 network 10.0.24.2 0.0.0.255 area 0
 network 10.0.25.1 0.0.0.255 area 0
 network 10.0.25.1 0.0.0.255 area 2
 network 10.0.26.2 0.0.0.255 area 0
 passive-interface Loopback900
!
end