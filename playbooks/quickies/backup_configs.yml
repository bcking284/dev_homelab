---
- name: Backup IOS configs
  hosts: ios
  gather_facts: false

  tasks:
    - name: Pull running config from IOS
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config

    - name: Save IOS config locally
      ansible.builtin.copy:
        content: "{{ config.stdout[0] }}"
        dest: "{{ playbook_dir }}/../../backups/pre_change/{{ inventory_hostname }}.cfg"


- name: Backup ASA configs
  hosts: asa
  gather_facts: false

  tasks:
    - name: Pull running config from ASA
      cisco.asa.asa_command:
        commands:
          - show running-config
      register: config

    - name: Save ASA config locally
      ansible.builtin.copy:
        content: "{{ config.stdout[0] }}"
        dest: "{{ playbook_dir }}/../../backups/pre_change/{{ inventory_hostname }}.cfg"