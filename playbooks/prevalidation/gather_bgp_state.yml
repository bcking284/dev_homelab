---
- name: Gather BGP state
  hosts: "{{ target | default('ios_bgp_routers') }}"
  gather_facts: false
  strategy: free

  tasks:
    - name: Gather bgp_global
      cisco.ios.ios_bgp_global:
        state: gathered
      register: bgp_global

    - name: Gather bgp_address_family
      cisco.ios.ios_bgp_address_family:
        state: gathered
      register: bgp_af

    - name: Write readable YAML
      ansible.builtin.shell:
        cmd: python3 "{{ playbook_dir }}/../../scripts/prettify.py" "{{ playbook_dir }}/../../backups/gathered/{{ inventory_hostname }}_bgp.yml"
        stdin: "{{ {'bgp_global': bgp_global.gathered,
                    'bgp_af': bgp_af.gathered} | to_json }}"
      delegate_to: localhost
      changed_when: true
