---
- name: Gather VRF and routing policy state
  hosts: "{{ target | default('ios') }}"
  gather_facts: false
  strategy: free

  tasks:
    - name: Ensure gathered directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../backups/gathered"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Gather VRF global
      cisco.ios.ios_vrf_global:
        state: gathered
      register: vrf_global

    - name: Gather VRF address families
      cisco.ios.ios_vrf_address_family:
        state: gathered
      register: vrf_af

    - name: Gather VRF interface assignments
      cisco.ios.ios_vrf_interfaces:
        state: gathered
      register: vrf_ifaces

    - name: Gather prefix lists
      cisco.ios.ios_prefix_lists:
        state: gathered
      register: prefix_lists

    - name: Gather route maps
      cisco.ios.ios_route_maps:
        state: gathered
      register: route_maps

    - name: Write readable YAML
      ansible.builtin.shell:
        cmd: >-
          python3 "{{ playbook_dir }}/../../scripts/prettify.py"
          "{{ playbook_dir }}/../../backups/gathered/{{ inventory_hostname }}_policy.yml"
        stdin: "{{ {'vrf_global': vrf_global.gathered,
                    'vrf_af': vrf_af.gathered,
                    'vrf_ifaces': vrf_ifaces.gathered,
                    'prefix_lists': prefix_lists.gathered,
                    'route_maps': route_maps.gathered} | to_json }}"
      delegate_to: localhost
      changed_when: true
