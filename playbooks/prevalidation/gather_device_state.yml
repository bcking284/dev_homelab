---
- name: Gather Device State
  hosts: "{{ target | default('ios_ospf_routers') }}"
  gather_facts: false
  strategy: free

  tasks:
    - name: Gather ospfv2
      cisco.ios.ios_ospfv2:
        state: gathered
      register: v2

    - name: Gather ospf_interfaces
      cisco.ios.ios_ospf_interfaces:
        state: gathered
      register: ifaces

    - name: Write per-host YAML
      ansible.builtin.copy:
        content: "{{ {'ospf_cfg': v2.gathered, 'ospf_ifaces': ifaces.gathered} | to_nice_yaml(indent=2) }}"
        dest: "{{ playbook_dir }}/../../backups/gathered/{{ inventory_hostname }}.yml"
      delegate_to: localhost
