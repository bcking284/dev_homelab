---
- name: Gather interface state
  hosts: "{{ target | default('ios') }}"
  gather_facts: false
  strategy: free

  tasks:
    - name: Gather L3 interface configs
      cisco.ios.ios_l3_interfaces:
        state: gathered
      register: l3

    - name: Gather L2 interface configs
      cisco.ios.ios_l2_interfaces:
        state: gathered
      register: l2

    - name: Gather interface descriptions and state
      cisco.ios.ios_interfaces:
        state: gathered
      register: intf

    - name: Write readable YAML
      ansible.builtin.shell:
        cmd: python3 "{{ playbook_dir }}/../../scripts/prettify.py" "{{ playbook_dir }}/../../backups/gathered/{{ inventory_hostname }}_interfaces.yml"
        stdin: "{{ {'l3_ifaces': l3.gathered,
                    'l2_ifaces': l2.gathered,
                    'interfaces': intf.gathered} | to_json }}"
      delegate_to: localhost
      changed_when: true
