---
- name: Create on-box configuration checkpoints
  hosts: ios
  gather_facts: false

  vars:
    checkpoint_name: "ckpt-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

  tasks:
    - name: Ensure archive is configured
      cisco.ios.ios_config:
        lines:
          - path flash:archive-
          - maximum 8
          - write-memory
        parents: archive

    - name: Disable file overwrite confirmation
      cisco.ios.ios_config:
        lines:
          - file prompt quiet

    - name: Save running config as a named checkpoint
      cisco.ios.ios_command:
        commands:
          - command: "copy running-config flash:{{ checkpoint_name }}.cfg"
            prompt: "Destination filename"
            answer: "{{ checkpoint_name }}.cfg"
      register: ckpt

    - name: Record checkpoint name for the rollback playbook
      ansible.builtin.copy:
        content: "{{ checkpoint_name }}.cfg"
        dest: "{{ playbook_dir }}/../../backups/checkpoints/{{ inventory_hostname }}.txt"
      delegate_to: localhost

    - name: Verify the checkpoint landed
      cisco.ios.ios_command:
        commands:
          - "dir flash:{{ checkpoint_name }}.cfg"
      register: verify
      failed_when: "'No such file' in verify.stdout[0]"