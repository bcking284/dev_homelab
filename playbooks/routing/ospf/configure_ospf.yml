---
- name: Configure OSPF via resource modules
  hosts: ios_ospf_routers
  gather_facts: false

  tasks:
    - name: OSPF process, areas, passive interfaces
      cisco.ios.ios_ospfv2:
        config: "{{ ospf_cfg }}"
        state: replaced
      register: ospf_result

    - name: Show generated commands
      ansible.builtin.debug:
        var: ospf_result.commands

