---
- name: Configure OSPF via resource modules
  hosts: ios_ospf_routers
  gather_facts: false

  tasks:
    - name: OSPF process, areas, passive interfaces
      cisco.ios.ios_ospfv2:
        config: "{{ ospf_v2 }}"
        state: replaced

    - name: OSPF interface enablement
      cisco.ios.ios_ospf_interfaces:
        config: "{{ ospf_ifaces }}"
        state: replaced