prefix_lists:
- afi: ipv4
  prefix_lists:
  - entries:
    - action: permit
      prefix: 10.0.0.0/20
      sequence: 10
    name: ASN_65513
  - entries:
    - action: permit
      le: 32
      prefix: 10.0.16.0/20
      sequence: 10
    name: OSPF_TO_BGP_PREFIXES
  - entries:
    - action: permit
      le: 32
      prefix: 10.20.16.0/20
      sequence: 20
    name: Test_prefix_1
route_maps:
- entries:
  - action: permit
    match:
      ip:
        address:
          prefix_lists:
          - ASN_65513
    sequence: 10
    set:
      local_preference: 110
  route_map: ASN_65513
- entries:
  - action: permit
    match:
      ip:
        address:
          prefix_lists:
          - OSPF_TO_BGP_PREFIXES
    sequence: 10
  - action: permit
    match:
      ip:
        address:
          prefix_lists:
          - Test_prefix_1
    sequence: 20
  route_map: OSPF_TO_BGP
- entries:
  - action: permit
    match:
      ip:
        address:
          prefix_lists:
          - OSPF_TO_BGP_PREFIXES
    sequence: 10
  route_map: WAN_out
