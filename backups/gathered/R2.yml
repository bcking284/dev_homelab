ospf_cfg:
  processes:
    - process_id: 1
      router_id: 10.8.2.2
      vrf: MGMT
      network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
    - process_id: 900
      router_id: 10.0.26.2
      areas:
        - area_id: '2'
          nssa:
            set: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
