bgp_af:
  address_family:
    - afi: ipv4
      neighbors:
        - activate: true
          neighbor_address: 10.0.26.1
      networks:
        - address: 10.0.30.0
          mask: 255.255.255.252
        - address: 10.0.30.4
          mask: 255.255.255.252
      redistribute:
        - ospf:
            process_id: 900
            route_map: OSPF_TO_BGP
      safi: unicast
  as_number: '65512'
bgp_global:
  as_number: '65512'
  bgp:
    default:
      ipv4_unicast: true
      route_target:
        filter: true
    log_neighbor_changes: true
  neighbors:
    - neighbor_address: 10.0.26.1
      remote_as: '65512'
