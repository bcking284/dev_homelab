l3_ifaces:
  - name: GigabitEthernet1
  - name: GigabitEthernet1.10
    ipv4:
      - address: 10.8.3.2/30
  - name: GigabitEthernet1.900
    ipv4:
      - address: 10.0.28.1/30
  - name: GigabitEthernet2
  - name: GigabitEthernet3
  - name: GigabitEthernet4
  - name: Loopback10
    ipv4:
      - address: 10.8.2.5/32
  - name: Loopback900
    ipv4:
      - address: 10.0.28.129/32
ospf_cfg:
  processes:
    - process_id: 1
      router_id: 10.8.2.5
      vrf: MGMT
      network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
    - process_id: 900
      router_id: 10.0.28.129
      areas:
        - area_id: '1'
          stub:
            set: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
    address_family:
      - afi: ipv4
        process:
          area_id: '1'
          id: 900
  - name: GigabitEthernet1
  - name: GigabitEthernet1.10
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
        process:
          area_id: '1'
          id: 900
  - name: GigabitEthernet2
  - name: GigabitEthernet3
  - name: GigabitEthernet4
