l3_ifaces:
  - name: GigabitEthernet1
  - name: GigabitEthernet1.13
    ipv4:
      - address: 10.8.3.26/30
  - name: GigabitEthernet1.900
  - name: GigabitEthernet2
  - name: GigabitEthernet2.12
    ipv4:
      - address: 10.8.3.22/30
  - name: GigabitEthernet3
  - name: GigabitEthernet3.11
    ipv4:
      - address: 10.8.3.18/30
  - name: GigabitEthernet3.900
  - name: GigabitEthernet4
  - name: GigabitEthernet4.10
    ipv4:
      - address: 10.8.1.102/24
  - name: GigabitEthernet4.11
  - name: GigabitEthernet4.900
  - name: Loopback10
    ipv4:
      - address: 10.8.2.253/32
  - name: Loopback900
    ipv4:
      - address: 10.8.4.253/32
ospf_cfg:
  processes:
    - process_id: 1
      router_id: 10.8.2.253
      vrf: MGMT_vrf
      network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
    - process_id: 900
      router_id: 10.8.4.253
      areas:
        - area_id: '2'
          nssa:
            set: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
  - name: GigabitEthernet1
  - name: GigabitEthernet1.13
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        process:
          area_id: '2'
          id: 900
  - name: GigabitEthernet2
  - name: GigabitEthernet2.12
  - name: GigabitEthernet3
  - name: GigabitEthernet3.11
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
  - name: GigabitEthernet3.900
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
        process:
          area_id: '0'
          id: 900
  - name: GigabitEthernet4
  - name: GigabitEthernet4.10
  - name: GigabitEthernet4.11
  - name: GigabitEthernet4.900
    address_family:
      - afi: ipv4
        network:
          broadcast: true
        process:
          area_id: '0'
          id: 900
