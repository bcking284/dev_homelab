ospf_cfg:
  processes:
  - network:
    - address: 0.0.0.0
      area: '0'
      wildcard_bits: 255.255.255.255
    process_id: 1
    router_id: 10.8.2.1
    vrf: MGMT

  - areas:
    - area_id: '1'
      stub:
        no_summary: true

    passive_interfaces:
      interface:
        name:
        - Loopback900
        set_interface: true

    process_id: 900
    router_id: 10.0.26.1

ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
    address_family:
    - afi: ipv4
      process:
        area_id: '0'
        id: 900
  - name: GigabitEthernet1
  - address_family:
    - afi: ipv4
      network:
        broadcast: true
  - name: GigabitEthernet1.10
  - name: GigabitEthernet1.900
    address_family:
    - afi: ipv4
      process:
        area_id: '0'
        id: 900
  - name: GigabitEthernet2
  - name: GigabitEthernet2.10
  - name: GigabitEthernet2.900
    address_family:
    - afi: ipv4
      process:
        area_id: '1'
        id: 900
  - name: GigabitEthernet3
  - address_family:
    - afi: ipv4
      network:
        point_to_point: true
  - name: GigabitEthernet3.11
  - name: GigabitEthernet4
