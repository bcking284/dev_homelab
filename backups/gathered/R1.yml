l3_ifaces:
  - name: GigabitEthernet1
  - name: GigabitEthernet1.10
    ipv4:
      - address: 10.8.1.100/24
  - name: GigabitEthernet1.900
    ipv4:
      - address: 10.0.24.1/24
  - name: GigabitEthernet2
  - name: GigabitEthernet2.10
    ipv4:
      - address: 10.8.3.1/30
  - name: GigabitEthernet2.900
    ipv4:
      - address: 10.0.28.2/30
  - name: GigabitEthernet3
  - name: GigabitEthernet3.11
    ipv4:
      - address: 10.8.3.17/30
  - name: GigabitEthernet4
    ipv4:
      - address: 10.0.3.2/24
  - name: Loopback10
    ipv4:
      - address: 10.8.2.1/32
  - name: Loopback900
    ipv4:
      - address: 10.0.26.1/32
ospf_cfg:
  processes:
    - process_id: 1
      router_id: 10.8.2.1
      vrf: MGMT
      network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
    - process_id: 900
      router_id: 10.0.26.1
      areas:
        - area_id: '1'
          stub:
            no_summary: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
    address_family:
      - afi: ipv4
        process:
          area_id: '0'
          id: 900
  - name: GigabitEthernet1
  - name: GigabitEthernet1.10
    address_family:
      - afi: ipv4
        network:
          broadcast: true
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        network:
          broadcast: true
        process:
          area_id: '0'
          id: 900
  - name: GigabitEthernet2
  - name: GigabitEthernet2.10
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
  - name: GigabitEthernet2.900
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
        process:
          area_id: '1'
          id: 900
  - name: GigabitEthernet3
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
  - name: GigabitEthernet3.11
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
  - name: GigabitEthernet4
