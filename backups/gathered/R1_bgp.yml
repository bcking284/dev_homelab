bgp_af:
  as_number: '65512'
  address_family:
    - afi: ipv4
      safi: unicast
      neighbors:
        - neighbor_address: 10.0.3.1
          activate: true
          route_maps:
            - name: ASN_65513
              in: true
            - name: WAN_out
              out: true
        - neighbor_address: 10.0.26.3
          activate: true
      networks:
        - address: 10.0.24.0
          mask: 255.255.255.0
        - address: 10.0.26.1
          mask: 255.255.255.255
        - address: 10.0.28.0
          mask: 255.255.255.252
      redistribute:
        - ospf:
            route_map: OSPF_TO_BGP
            process_id: 900
bgp_global:
  as_number: '65512'
  bgp:
    default:
      ipv4_unicast: true
      route_target:
        filter: true
    log_neighbor_changes: true
  neighbors:
    - neighbor_address: 10.0.26.3
      remote_as: '65512'
    - neighbor_address: 10.0.3.1
      remote_as: '65513'
