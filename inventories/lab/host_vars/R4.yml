---
router_id: 10.0.26.4

restconf:
  host: 10.8.2.4

bgp:
  asn: 65512
  update_source: Loopback900

  redistribute:
    ospf:
      enabled: false
      process_id: 900
      route_map: OSPF_TO_BGP

  prefix_lists:
    - name: OSPF_TO_BGP_PREFIXES
      entries:
        - seq: 10
          action: permit
          prefix: 10.0.16.0/20
          le: 32

  route_maps:
    - name: OSPF_TO_BGP
      entries:
        - seq: 10
          action: permit
          match_prefix_list: OSPF_TO_BGP_PREFIXES

  networks:
    - number: 10.0.30.4
      mask: 255.255.255.252

    - number: 10.0.30.0
      mask: 255.255.255.252

    - number: 10.0.34.64
      mask: 255.255.255.252


  neighbors:
    - name: R1
      peer_ip: 10.0.26.1
      remote_as: 65512
      multihop: true

ospf_cfg:
  processes:
    - network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
      process_id: 1
      router_id: 10.8.2.4
      vrf: MGMT
    - areas:
        - area_id: '2'
          nssa:
            set: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
      process_id: 900
      router_id: 10.0.26.4

ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
  - name: GigabitEthernet1
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
        network:
          point_to_point: true
  - name: GigabitEthernet2
  - name: GigabitEthernet2.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
        network:
          point_to_point: true
  - name: GigabitEthernet3
  - name: GigabitEthernet3.13
  - name: GigabitEthernet3.23
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
        network:
          point_to_point: true
  - name: GigabitEthernet4
