---
restconf:
  host: 10.8.2.2

bgp:
  asn: 65514

ospf_cfg:
  processes:
    - network:
        - address: 0.0.0.0
          area: '0'
          wildcard_bits: 255.255.255.255
      process_id: 1
      router_id: 10.8.2.253
      vrf: MGMT_vrf
    - areas:
        - area_id: '2'
          nssa:
            set: true
      passive_interfaces:
        interface:
          name:
            - Loopback900
          set_interface: true
      process_id: 900
      router_id: 10.8.4.253

ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
  - name: GigabitEthernet1
  - name: GigabitEthernet1.10
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
  - name: GigabitEthernet2
  - name: GigabitEthernet2.12
  - name: GigabitEthernet3
  - name: GigabitEthernet3.10
  - name: GigabitEthernet3.900
    address_family:
      - afi: ipv4
        network:
          point_to_point: true
        process:
          id: 900
          area_id: 0
  - name: GigabitEthernet4
  - name: GigabitEthernet4.10
  - name: GigabitEthernet4.900
    address_family:
      - afi: ipv4
        network:
          broadcast: true
        process:
          id: 900
          area_id: 0

ospf_mgmt:
  processes:
    - process_id: 1
      router_id: "10.8.2.1"
      vrf: "MGMT"
      network:
        - address: "0.0.0.0"
          area: "0"
          wildcard_bits: "255.255.255.255"
