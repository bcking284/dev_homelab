---
router_id: 10.0.26.3

restconf:
  host: 10.8.2.3

bgp:
  asn: 65512

ospf_cfg:
  processes:
  - network:
    - address: 0.0.0.0
      area: '0'
      wildcard_bits: 255.255.255.255
    process_id: 1
    router_id: 10.8.2.3
    vrf: MGMT
  - areas:
    - area_id: '2'
      nssa:
        set: true
    passive_interfaces:
      interface:
        name:
        - Loopback900
        set_interface: true
    process_id: 900
    router_id: 10.0.26.3


ospf_ifaces:
  - name: Loopback10
  - name: Loopback900
  - name: GigabitEthernet1
  - address_family:
    - afi: ipv4
      network:
        point_to_point: true
    name: GigabitEthernet1.10
  - name: GigabitEthernet1.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 0
  - name: GigabitEthernet2
  - address_family:
    - afi: ipv4
      network:
        point_to_point: true
    name: GigabitEthernet2.10
  - name: GigabitEthernet2.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 2
  - name: GigabitEthernet3
  - address_family:
    - afi: ipv4
      network:
        broadcast: true
    name: GigabitEthernet3.10
  - name: GigabitEthernet3.900
    address_family:
      - afi: ipv4
        process:
          id: 900
          area_id: 0
  - name: GigabitEthernet4
