---
- name: Backup Cisco Configs
  hosts: ios
  gather_facts: False

  tasks:

    - name: Pull running config
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: config

    - name: Save config locally
      copy:
        content: "{{ config.stdout[0] }}"
        dest: "{{ playbook_dir }}/../../backups/ios/{{ inventory_hostname }}.cfg"